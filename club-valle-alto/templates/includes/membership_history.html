<div class="tarjeta seccion"><h2 class="tarjeta__titulo">Historial de membresía</h2><div class="tabla-contenedor"><table class="tabla"><thead><tr><th>Fecha</th><th>Anterior</th><th>Nuevo</th><th>Responsable</th><th>Motivo</th></tr></thead><tbody>
{% for cambio in membresia.historial.all %}<tr><td>{{ cambio.fecha }}</td><td>{{ cambio.anterior|default:'—' }}</td><td>{{ cambio.nuevo }}</td><td>{{ cambio.actor|default:'Sistema' }}</td><td>{{ cambio.motivo }}</td></tr>{% empty %}<tr><td colspan="5">Sin cambios registrados.</td></tr>{% endfor %}
</tbody></table></div></div>
