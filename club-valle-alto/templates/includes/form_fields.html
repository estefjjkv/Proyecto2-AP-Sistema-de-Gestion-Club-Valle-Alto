{% if form.errors %}<div class="alerta alerta--error" role="alert">Revise los campos indicados.</div>{% endif %}
{{ form.non_field_errors }}
{% for field in form %}
<div class="campo">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="ayuda-campo">{{ field.help_text|safe }}</div>{% endif %}
  {% for error in field.errors %}<p class="error-campo" role="alert">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
