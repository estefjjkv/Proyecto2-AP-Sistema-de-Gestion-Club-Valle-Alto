<header class="topbar-socio"><div class="topbar-socio__contenedor">
<a class="topbar-socio__marca" href="{% url 'usuarios:login' %}">Club Valle Alto</a>
{% if user.rol == 'socio' %}<nav aria-label="Navegación del socio"><ul class="topbar-socio__nav">
<li><a href="{% url 'socios:inicio' %}">Inicio</a></li><li><a href="{% url 'membresias:mi_membresia' %}">Membresía</a></li><li><a href="{% url 'invitados:mis_invitados' %}">Invitados</a></li><li><a href="/instalaciones/">Instalaciones</a></li><li><a href="/reservas/">Reservas</a></li><li><a href="/estado-cuenta/">Estado de cuenta</a></li></ul></nav>{% endif %}
<div class="topbar-socio__usuario">{% if user.rol == 'socio' %}<a class="usuario-chip" href="{% url 'socios:perfil' %}">{{ user.get_full_name }}</a>{% else %}<span>{{ user.get_full_name }}</span>{% endif %}
<form method="post" action="{% url 'usuarios:salir' %}">{% csrf_token %}<button class="link-salir boton-link">Salir</button></form></div></div></header>
