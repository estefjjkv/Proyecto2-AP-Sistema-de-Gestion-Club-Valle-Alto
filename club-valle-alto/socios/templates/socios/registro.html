{% extends 'base_auth.html' %}
{% block titulo %}Crear cuenta de socio{% endblock %}
{% block contenido %}
<div class="auth-caja auth-caja--ancha">
  <h2>Crear cuenta de socio</h2>
  <p class="auth-caja__desc">Complete sus datos para registrarse en el club.</p>

  <form class="formulario" method="post" action="/socios/inicio/" novalidate>
    {% csrf_token %}
    <div class="campo">
      <label for="id_nombre_completo">Nombre completo</label>
      <input id="id_nombre_completo" name="nombre_completo" type="text" placeholder="Nombre y apellidos" autocomplete="name" required>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label for="id_cedula">Cédula</label>
        <input id="id_cedula" name="cedula" type="text" placeholder="0-0000-0000" required>
      </div>
      <div class="campo">
        <label for="id_fecha_nacimiento">Fecha de nacimiento</label>
        <input id="id_fecha_nacimiento" name="fecha_nacimiento" type="text" placeholder="dd/mm/aaaa" onfocus="this.type='date'" onblur="if(!this.value)this.type='text'" required>
      </div>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label for="id_correo">Correo electrónico</label>
        <input id="id_correo" name="correo" type="email" placeholder="socio@correo.com" autocomplete="email" required>
      </div>
      <div class="campo">
        <label for="id_telefono">Teléfono</label>
        <input id="id_telefono" name="telefono" type="tel" placeholder="0000-0000" autocomplete="tel" required>
      </div>
    </div>

    <div class="campo">
      <label for="id_direccion">Dirección</label>
      <input id="id_direccion" name="direccion" type="text" placeholder="Provincia, cantón, distrito" autocomplete="street-address" required>
    </div>

    <div class="fila-campos">
      <div class="campo">
        <label for="id_password1">Contraseña</label>
        <input id="id_password1" name="password1" type="password" placeholder="********" autocomplete="new-password" required>
      </div>
      <div class="campo">
        <label for="id_password2">Confirmar contraseña</label>
        <input id="id_password2" name="password2" type="password" placeholder="********" autocomplete="new-password" data-coincide="id_password1" required>
      </div>
    </div>

    <button class="boton boton--completo" type="submit" style="margin-top:0.5rem">Crear Cuenta</button>
  </form>

  <p style="text-align:center;margin-top:1.25rem;font-size:0.9rem;color:var(--texto-suave)">
    ¿Ya tiene cuenta? <a href="/usuarios/login/" style="font-weight:700;color:var(--verde-club)">Inicie sesión</a>
  </p>
</div>
{% endblock %}
